name: Repository Hygiene

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  generated-issue-script-guard:
    name: Generated issue script guard
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check generated issue helper artifacts
        run: npm run guard:generated-issue-scripts
