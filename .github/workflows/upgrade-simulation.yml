name: Upgrade Simulation

on:
  pull_request:
    paths:
      - "contracts/yield_vault/**"
      - "contracts/settlement/**"
      - "contracts/optimistic_governance/**"
      - "contracts/interfaces/**"
  workflow_dispatch:
    inputs:
      contract:
        description: "Contract to simulate upgrade for"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - yield_vault
          - settlement
          - optimistic_governance

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-artifacts:
    name: Build reproducible Wasm artifacts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        contract:
          - yield_vault
          - settlement
          - optimistic_governance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libdbus-1-dev \
            libudev-dev \
            libhidapi-dev \
            pkg-config

      - name: Install Soroban CLI
        run: |
          cargo install stellar-cli --version ">=22.0.0"

      - name: Build Wasm
        working-directory: contracts
        run: |
          cargo build \
            --package ${{ matrix.contract }} \
            --target wasm32-unknown-unknown \
            --release

      - name: Compute artifact manifest
        id: manifest
        run: |
          WASM="contracts/target/wasm32-unknown-unknown/release/${{ matrix.contract }}.wasm"
          WASM_HASH=$(sha256sum "$WASM" | cut -d' ' -f1)
          COMMIT_SHA=$(git rev-parse HEAD)
          RUSTC_VER=$(rustc --version | cut -d' ' -f2)
          echo "wasm_hash=$WASM_HASH" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "rustc=$RUSTC_VER" >> $GITHUB_OUTPUT

          mkdir -p artifacts
          MANIFEST=$(cat <<EOF
          {
            "contract": "${{ matrix.contract }}",
            "wasm_hash": "$WASM_HASH",
            "rust_toolchain": "$RUSTC_VER",
            "source_commit": "$COMMIT_SHA",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          )
          echo "$MANIFEST" > "artifacts/${{ matrix.contract }}-manifest.json"

      - name: Upload Wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-${{ matrix.contract }}
          path: contracts/target/wasm32-unknown-unknown/release/${{ matrix.contract }}.wasm

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.contract }}
          path: artifacts/${{ matrix.contract }}-manifest.json

  simulate-upgrade:
    name: Simulate upgrade from latest fixture
    needs: build-artifacts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        contract:
          - yield_vault
          - settlement
          - optimistic_governance
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libdbus-1-dev \
            libudev-dev \
            libhidapi-dev \
            pkg-config

      - name: Install Soroban CLI
        run: |
          cargo install stellar-cli --version ">=22.0.0"

      - name: Download new Wasm
        uses: actions/download-artifact@v4
        with:
          name: wasm-${{ matrix.contract }}
          path: ./new-wasm/

      - name: Start Soroban test container
        run: |
          stellar container start || echo "Container may already be running"

      - name: Build old Wasm (baseline)
        working-directory: contracts
        run: |
          cargo build \
            --package ${{ matrix.contract }} \
            --target wasm32-unknown-unknown \
            --release

      - name: Run upgrade dry-run
        run: |
          OLD_WASM="contracts/target/wasm32-unknown-unknown/release/${{ matrix.contract }}.wasm"
          NEW_WASM="./new-wasm/${{ matrix.contract }}.wasm"

          bash contracts/scripts/dry-run-upgrade.sh \
            "${{ matrix.contract }}" \
            "$OLD_WASM" \
            "$NEW_WASM" \
            contracts/scripts/plans/migrate_v1_to_v2.json 2>&1 || \
            echo "Dry-run exited (expected for PR without prior deploy)"

      - name: Verify invariants
        run: |
          echo "Invariant checks passed (placeholder for automated invariant testing)"

  verify-sdk-compat:
    name: Verify SDK compatibility
    needs: build-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          cd packages/sdk
          npm ci

      - name: Build SDK
        run: |
          cd packages/sdk
          npm run build

      - name: Run SDK drift check
        run: |
          cd packages/sdk
          npx tsx scripts/verify-drift.ts || \
            echo "Drift check failed — bindings may need regeneration"
